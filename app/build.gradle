plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 35
    buildToolsVersion "35.0.0"
    namespace 'com.mindease.app'

    defaultConfig {
        applicationId "com.mindease.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Read Gemini API key from local.properties
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties.getProperty('GEMINI_API_KEY', '')}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Firebase BOM — manages all Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // CardView & RecyclerView
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Gemini AI SDK
    implementation 'com.google.ai.client.generativeai:generativeai:0.7.0'

    // MPAndroidChart (mood graphs) — requires JitPack repo
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Biometric (fingerprint unlock)
    implementation 'androidx.biometric:biometric:1.1.0'

    // Lottie (breathing animation)
    implementation 'com.airbnb.android:lottie:6.4.0'

    // SharedPreferences helper
    implementation 'androidx.preference:preference:1.2.1'

    // ViewPager2 (onboarding slides)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // AppCompat
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-storage:22.0.1'

    // Guava (for Futures used by Gemini)
    implementation 'com.google.guava:guava:33.2.1-android'
}
